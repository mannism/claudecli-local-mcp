name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Accepted-risk: GHSA-q8mj-m7cp-5q26 (qs moderate DoS via `qs.stringify` on null array entries when
      # `encodeValuesOnly` is set). No reachable attack surface — this repo never calls `qs.stringify`,
      # transitive callers (googleapis OAuth) do not pass user-controlled data through that codepath.
      # Track upstream: `qs@6.15.2`.
      # ws HIGH advisories (GHSA-58qx-3vcg-4xpx uninitialized memory disclosure, GHSA-96hv-2xvq-fx4p
      # memory exhaustion DoS) and form-data HIGH advisory (GHSA-hmw2-7cc7-3qxx CRLF injection) are
      # resolved by package.json overrides pinning ws>=8.21.0 and form-data>=4.0.6.
      - run: npm audit --production --audit-level=high
